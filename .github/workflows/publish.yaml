# Publish to PyPI when a GitHub release is published.
#
# Releasing is deliberately a two-step, human-initiated process:
#
#   1. bump `version` in pyproject.toml in a normal pull request, and merge it;
#   2. draft a GitHub release tagged `v<version>` and publish it.
#
# Merging alone therefore no longer releases anything, so changes can be batched
# and the version number can say what kind of change it is. The tag is checked
# against the built distribution below, so the two cannot drift apart.
name: Publish to PyPI

on:
  release:
    types: [published]

# Uploads use PyPI trusted publishing, so no API token is stored here.
# See https://docs.pypi.org/trusted-publishers/
permissions: {}

jobs:
  release:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scenvi
    permissions:
      contents: read
      id-token: write # mandatory for trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Check the release tag matches what was built
        # Compared against the wheel rather than pyproject.toml, so this checks the
        # artifact that is actually about to be uploaded.
        run: |
          set -euo pipefail
          shopt -s nullglob # so a missing wheel counts as zero, not as the literal glob

          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi

          # {distribution}-{version}-{python tag}-{abi tag}-{platform tag}.whl
          version="$(basename "${wheels[0]}" | cut -d- -f2)"
          tag="${GITHUB_REF_NAME#v}"

          if [ "$tag" != "$version" ]; then
            echo "::error::release tag '${GITHUB_REF_NAME}' does not match the built version '${version}'"
            echo "Bump 'version' in pyproject.toml, or retag the release as 'v${version}'."
            exit 1
          fi
          echo "Releasing version ${version}."

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
